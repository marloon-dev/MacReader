name: Release

# Ao enviar uma tag vX.Y.Z: compila tudo (workflow Build) e publica a release com
# os instaladores, as instruções e os arquivos de atualização automática.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já existente (ex.: v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  conferir:
    name: Conferir a versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: A tag bate com o package.json?
        run: |
          versao="$(node -p "require('./package.json').version")"
          tag="${{ steps.tag.outputs.tag }}"
          if [ "v$versao" != "$tag" ]; then
            echo "::error::A tag $tag não bate com a versão $versao do package.json."
            exit 1
          fi

  build:
    name: Build
    needs: conferir
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.conferir.outputs.tag }}
    secrets: inherit

  publicar:
    name: Publicar a release
    needs: [conferir, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.conferir.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # Pasta própria: "assets" já existe no repositório (ícones) e iria junto.
      - uses: actions/download-artifact@v5
        with:
          path: instaladores
          merge-multiple: true

      - name: Arquivos de atualização e somas de verificação
        run: |
          versao="${TAG#v}"
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          data="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ipa="macreader-ios-v$versao.ipa"

          # macOS: lido pelo atualizador do Tauri
          jq -n --arg v "$versao" --arg d "$data" \
            --arg s "$(cat instaladores/macreader-macos-universal.app.tar.gz.sig)" \
            --arg u "$base/macreader-macos-universal.app.tar.gz" '{
              version: $v,
              notes: "Veja as novidades em https://github.com/marloon-dev/MacReader/releases",
              pub_date: $d,
              platforms: {
                "darwin-aarch64": { signature: $s, url: $u },
                "darwin-x86_64": { signature: $s, url: $u }
              }
            }' > instaladores/latest.json

          # iPhone: fonte do AltStore
          jq -n --arg v "$versao" --arg d "${data%%T*}" --arg u "$base/$ipa" \
            --argjson tamanho "$(stat -c %s "instaladores/$ipa")" \
            --arg icone "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/icon-1024.png" '{
              name: "MacReader",
              identifier: "io.github.marloondev.macreader.source",
              subtitle: "Leitor de livros digitais",
              website: "https://github.com/marloon-dev/MacReader",
              iconURL: $icone,
              apps: [{
                name: "MacReader",
                bundleIdentifier: "io.github.marloondev.macreader",
                developerName: "marloon-dev",
                subtitle: "Leitor de livros digitais",
                localizedDescription: "Leia EPUB, PDF, MOBI, AZW3, FB2 e CBZ com estante, temas de leitura, marcadores e destaques. Seus livros ficam no aparelho.",
                iconURL: $icone,
                tintColor: "#F2A541",
                category: "reference",
                versions: [{
                  version: $v,
                  date: $d,
                  localizedDescription: "Veja as novidades em https://github.com/marloon-dev/MacReader/releases",
                  downloadURL: $u,
                  size: $tamanho,
                  minOSVersion: "15.0"
                }],
                appPermissions: { entitlements: [], privacy: {} }
              }],
              news: []
            }' > instaladores/altstore.json

          (cd instaladores && sha256sum macreader-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Texto da release
        run: |
          versao="${TAG#v}"
          {
            awk -v v="$versao" '
              $0 ~ "^## \\[" v "\\]" { dentro = 1; next }
              dentro && /^## \[/ { exit }
              dentro { print }
            ' CHANGELOG.md
            echo
            sed "s/vX\.Y\.Z/v$versao/g" docs/INSTALACAO.md
          } > notas.md
          cat notas.md

      - name: Publicar
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" instaladores/* --clobber
            gh release edit "$TAG" --notes-file notas.md --draft=false --latest
          else
            gh release create "$TAG" instaladores/* --verify-tag --latest \
              --title "MacReader $TAG" --notes-file notas.md
          fi
